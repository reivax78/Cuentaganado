<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada — Cuentaganado</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 1.5rem;
    text-align: center;
    color: #1a1a1a;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #14161a; }
  }
  .tarjeta { max-width: 420px; }
  .check {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
  p { line-height: 1.6; color: #4b5563; }
  @media (prefers-color-scheme: dark) {
    p { color: #a3a9b3; }
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="check">✅</div>
    <h1>Tu cuenta quedó confirmada</h1>
    <p>
      Ya podés volver a la app <strong>Cuentaganado</strong> en tu celular
      o computadora e iniciar sesión con tu email y contraseña.
    </p>
  </div>
</body>
</html>
